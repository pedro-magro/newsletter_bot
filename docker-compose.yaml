services:
  postgres:
    image: postgres:17
    container_name: newsbot-postgres
    restart: unless-stopped
    environment:
        POSTGRES_DB: newsbot
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg-isready -U newbot -d newsbot"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
