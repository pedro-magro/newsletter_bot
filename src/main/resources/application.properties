spring.application.name=telegram_bot
server.port=8080
spring.config.import=optional:file:./.env[.properties]

#DB
spring.datasource.url=${DB_URLL:jdbc:postgresql://localhost:5432/newsbot}
spring.datasource.username=${DB_USER:newsbot}
spring.datasource.password=${DB_PASSWORD:newsbot}

#JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

#DEV

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Flyway
spring.flyway.enabled=true
spring.flyway.location=classpath:db/migration

#Telegram
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.polling.enabled=true

